name: Publish example

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Verify and regenerate the public synthetic example
        run: |
          python -m unittest discover -s tests -v
          python examples/research-workspace/generate.py
          git diff --exit-code -- examples/research-workspace/catalog.json examples/research-workspace/index.html examples/research-workspace/workspace-map.json
          mkdir _site
          cp examples/research-workspace/index.html _site/index.html
          cp examples/research-workspace/catalog.json _site/catalog.json
          cp examples/research-workspace/workspace-map.json _site/workspace-map.json
          cp examples/refund-dashboard/architecture.html _site/refund-dashboard.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public example
        id: deployment
        uses: actions/deploy-pages@v4
